name: Atualizar dados do SIG (CREA-PR)

# Roda todo dia às 09:00 UTC (~06:00 de Brasília) e também sob demanda (botão "Run workflow").
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependência
        run: pip install requests

      - name: Consultar o SIG e gerar sig_data.js
        run: python automacao/update_sig.py

      - name: Publicar mudanças (se houver)
        run: |
          git config user.name "AEFOS bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sig_data.js
          if git diff --staged --quiet; then
            echo "Sem mudanças nos dados hoje."
          else
            git commit -m "Atualiza dados do SIG (automático)"
            git push
          fi
